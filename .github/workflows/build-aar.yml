# Builds the .aar on every push to main and commits it to dist/ObjDashboard.aar,
# which is what the download link at the top of README.md points to.
name: Build AAR

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-aar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleRelease

      - name: Copy to dist/
        run: |
          mkdir -p dist
          cp build/outputs/aar/ObjDashboard-release.aar dist/ObjDashboard.aar

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ObjDashboard.aar
          if git diff --cached --quiet; then
            echo "AAR unchanged"
          else
            git commit -m "Update ObjDashboard.aar from ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
