plugins {
    // Matches the Android Gradle Plugin used by FtcRobotController v12.0
    id 'com.android.library' version '8.13.2'
}

// FTC SDK version. Must match the Robot Controller app installed on the robot.
def ftcSdkVersion = '12.0.0'

android {
    namespace = 'org.firstinspires.ftc.objdash'

    // Same compileSdk as FtcRobotController v12.0 (build.common.gradle)
    compileSdk = 30

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        // OnBot Java only supports Java 8
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    // No Android resources, assets, BuildConfig, etc. OnBot Java rejects .aar files with assets.
    buildFeatures {
        buildConfig = false
        resValues = false
        androidResources = false
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    // compileOnly: the SDK is already on the Robot Controller, so it must NOT be bundled into the .aar
    compileOnly "org.firstinspires.ftc:RobotCore:$ftcSdkVersion"
    compileOnly "org.firstinspires.ftc:FtcCommon:$ftcSdkVersion"
    compileOnly "org.firstinspires.ftc:RobotServer:$ftcSdkVersion"
    compileOnly "org.firstinspires.ftc:Hardware:$ftcSdkVersion"
}

// ---------------------------------------------------------------------------------------------
// Web UI embedding.
//
// OnBot Java rejects .aar files that contain assets, so the files in src/main/web are turned into
// a generated Java class (org.firstinspires.ftc.objdash.WebAssets) that holds them as strings.
// Edit the .html/.js/.css files normally; this runs automatically on every build.
// ---------------------------------------------------------------------------------------------
abstract class GenerateWebAssets extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getWebDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    static String javaLiteral(String s) {
        StringBuilder b = new StringBuilder('"')
        for (char c : s.toCharArray()) {
            switch (c) {
                case '\\': b.append('\\\\'); break
                case '"': b.append('\\"'); break
                case '\n': b.append('\\n'); break
                case '\r': b.append('\\r'); break
                case '\t': b.append('\\t'); break
                default:
                    if (c < 0x20 || c > 0x7e) b.append(String.format('\\u%04x', (int) c))
                    else b.append(c)
            }
        }
        return b.append('"').toString()
    }

    static String mimeFor(String name) {
        if (name.endsWith('.html')) return 'text/html; charset=utf-8'
        if (name.endsWith('.js')) return 'application/javascript; charset=utf-8'
        if (name.endsWith('.css')) return 'text/css; charset=utf-8'
        if (name.endsWith('.svg')) return 'image/svg+xml'
        if (name.endsWith('.json')) return 'application/json; charset=utf-8'
        return 'text/plain; charset=utf-8'
    }

    @TaskAction
    void generate() {
        File root = webDir.get().asFile
        List<File> files = []
        root.eachFileRecurse(groovy.io.FileType.FILES) { if (!it.name.startsWith('.')) files << it }
        files.sort { it.path }

        StringBuilder src = new StringBuilder()
        src << '// GENERATED by the generateWebAssets Gradle task from src/main/web. Do not edit.\n'
        src << 'package org.firstinspires.ftc.objdash;\n\n'
        src << 'final class WebAssets {\n'
        src << '    private WebAssets() {}\n\n'
        src << '    /** Paths relative to src/main/web, using forward slashes. */\n'
        src << '    static final String[] PATHS = {\n'
        files.each { src << '        ' << GenerateWebAssets.javaLiteral(root.toPath().relativize(it.toPath()).toString().replace('\\', '/')) << ',\n' }
        src << '    };\n\n'
        src << '    static String mime(String path) {\n'
        files.eachWithIndex { f, i ->
            String rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            src << '        if (' << GenerateWebAssets.javaLiteral(rel) << '.equals(path)) return ' << GenerateWebAssets.javaLiteral(GenerateWebAssets.mimeFor(f.name)) << ';\n'
        }
        src << '        return null;\n    }\n\n'
        src << '    static String content(String path) {\n'
        files.eachWithIndex { f, i ->
            String rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            src << '        if (' << GenerateWebAssets.javaLiteral(rel) << '.equals(path)) return file' << i << '();\n'
        }
        src << '        return null;\n    }\n'
        // Each string constant in a class file is limited to 64 KB, so large files are split into
        // chunks and joined at runtime.
        files.eachWithIndex { f, i ->
            String text = f.getText('UTF-8')
            src << '\n    private static String file' << i << '() {\n'
            src << '        StringBuilder b = new StringBuilder(' << text.length() << ');\n'
            for (int start = 0; start < text.length(); start += 8000) {
                src << '        b.append(' << GenerateWebAssets.javaLiteral(text.substring(start, Math.min(text.length(), start + 8000))) << ');\n'
            }
            src << '        return b.toString();\n    }\n'
        }
        src << '}\n'

        File out = new File(outputDir.get().asFile, 'org/firstinspires/ftc/objdash/WebAssets.java')
        out.parentFile.mkdirs()
        out.setText(src.toString(), 'UTF-8')
    }
}

def generateWebAssets = tasks.register('generateWebAssets', GenerateWebAssets) {
    webDir = layout.projectDirectory.dir('src/main/web')
    outputDir = layout.buildDirectory.dir('generated/source/objdashWeb')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(generateWebAssets, GenerateWebAssets::getOutputDir)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-options']
}
